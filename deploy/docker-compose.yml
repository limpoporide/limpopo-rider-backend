# Lives on the droplet in ~/limpopo/ next to the two cloned repos.
# TLS is handled by the Caddy already installed on the host (see Caddyfile).
services:
  rider:
    build: ../limpopo-rider-backend
    env_file: rider.env
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
  driver:
    build: ../limpopo-driver-backend
    env_file: driver.env
    ports: ["127.0.0.1:3001:3000"]
    restart: unless-stopped
